<style>
:root{
  --paper:#f6efe4; --card:#fffaf2; --ink:#2b2420; --soft:#7a6c60; --line:#e7dccb;
  --terra:#c4633f; --terra-d:#a94f2f; --olive:#5f7442; --mustard:#d9a441;
  --serif:'Frank Ruhl Libre', 'Times New Roman', serif;
  --sans:'Heebo', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(60,40,20,.06), 0 8px 24px rgba(60,40,20,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px}
body{min-height:100vh;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* רקע חי ועדין */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.28;animation:drift 26s ease-in-out infinite alternate}
.bg i:nth-child(1){width:340px;height:340px;background:#e9a37f;top:-120px;right:-80px}
.bg i:nth-child(2){width:300px;height:300px;background:#b9c79a;top:160px;left:-140px;animation-duration:32s;animation-delay:-8s}
.bg i:nth-child(3){width:260px;height:260px;background:#f1cf8c;bottom:-80px;right:10%;animation-duration:38s;animation-delay:-16s}
@keyframes drift{to{transform:translate(40px,60px) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}}

.wrap{max-width:980px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:12px;padding:calc(18px + env(safe-area-inset-top)) 0 10px}
header.top img{width:46px;height:46px;border-radius:13px;box-shadow:var(--shadow)}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--serif);font-weight:900;font-size:30px;line-height:1;margin:0;letter-spacing:-.5px}
.brand p{margin:3px 0 0;color:var(--soft);font-size:14px}
.acct{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);font-weight:700;color:#fff}
.acct.out{color:var(--ink)}

.search{position:sticky;top:0;z-index:5;padding:10px 0 8px;background:linear-gradient(var(--paper) 75%, rgba(246,239,228,0))}
.sbox{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;height:52px;box-shadow:var(--shadow)}
.sbox svg{color:var(--soft)}
.sbox input{flex:1;border:0;outline:0;background:none;font-size:17px;height:100%;min-width:0}
.sbox input::placeholder{color:#a89a8c}
.sbox input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.sbox .clr{display:none;color:var(--soft)}
.sbox.has .clr{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:500;white-space:nowrap;transition:.15s}
.chip svg.i{width:18px;height:18px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{color:var(--soft);font-size:13px;margin:8px 2px 10px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);text-align:right;display:flex;flex-direction:column;transition:transform .15s;animation:pop .35s ease both}
.card:active{transform:scale(.97)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.pic{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--tint,#efe3d2)}
.pic img,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tile{position:absolute;inset:0;display:grid;place-items:center;color:var(--tone,#c4633f);background:radial-gradient(circle at 70% 30%, rgba(255,255,255,.55), transparent 60%), var(--tint,#efe3d2)}
.tile svg.i{width:46%;height:46%;stroke-width:1.2;opacity:.85}
.badge{position:absolute;bottom:8px;right:8px;display:flex;align-items:center;gap:4px;background:rgba(43,36,32,.78);color:#fff;font-size:12px;padding:3px 8px 3px 9px;border-radius:999px}
.badge svg.i{width:13px;height:13px;fill:#fff;stroke:none}
.card .t{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;gap:4px}
.card h3{margin:0;font-size:15.5px;line-height:1.3;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--soft);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--soft);padding:60px 20px}
.empty b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink);margin-bottom:6px}

.fab{position:fixed;left:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:10;height:58px;padding:0 22px 0 18px;border-radius:999px;background:var(--terra);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px rgba(196,99,63,.42)}
.fab:active{transform:scale(.96)}

/* חלונות */
.sheet{position:fixed;inset:0;z-index:20;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet .in{max-width:720px;margin:0 auto;padding:0 18px calc(60px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;pointer-events:none}
.round{pointer-events:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,250,242,.92);box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.hero{margin:-64px -18px 0;aspect-ratio:16/11;max-height:52vh;width:calc(100% + 36px);position:relative;overflow:hidden;background:var(--tint)}
@media(min-width:720px){.hero{margin:-64px 0 0;width:100%;border-radius:0 0 24px 24px}}
.rtitle{font-family:var(--serif);font-weight:900;font-size:30px;line-height:1.15;margin:20px 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--soft);font-size:14px;align-items:center}
.meta span{display:flex;align-items:center;gap:5px}
.meta svg.i{width:16px;height:16px}
.acts{display:flex;gap:8px;margin:16px 0 6px;flex-wrap:wrap}
.btn{text-decoration:none;color:inherit;height:46px;padding:0 16px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:15px;background:var(--card);border:1px solid var(--line)}
.btn.main{background:var(--terra);color:#fff;border-color:var(--terra)}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.wide{width:100%;height:54px;font-size:17px}
.btn svg.i{width:19px;height:19px}
h2.sec{font-family:var(--serif);font-size:22px;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
h2.sec small{font-family:var(--sans);font-size:13px;color:var(--soft);font-weight:400}
ul.ing{list-style:none;margin:0;padding:0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
ul.ing li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);line-height:1.45;cursor:pointer;transition:.15s}
ul.ing li:first-child{border-top:0}
ul.ing li .box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid #cdbda8;margin-top:1px;display:grid;place-items:center;transition:.15s}
ul.ing li.done{color:#a99b8d;text-decoration:line-through}
ul.ing li.done .box{background:var(--olive);border-color:var(--olive)}
ul.ing li.done .box::after{content:'';width:10px;height:5px;border:solid #fff;border-width:0 0 2.4px 2.4px;transform:rotate(-45deg) translate(1px,-1px)}
ul.ing li.head{cursor:default;font-weight:700;background:#f3e9da;color:var(--terra-d);padding:9px 14px;font-size:14.5px}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{position:relative;padding:14px 50px 14px 14px;margin-bottom:10px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);line-height:1.6;cursor:pointer;transition:.2s}
ol.steps li::before{counter-increment:s;content:counter(s);position:absolute;right:12px;top:13px;width:28px;height:28px;border-radius:50%;background:var(--terra);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
ol.steps li.done{opacity:.45}
ol.steps li.done::before{background:var(--olive)}
.note{margin-top:18px;padding:14px 16px;border-radius:var(--r);background:#f9ecc9;line-height:1.55;font-size:15px}
.by{margin-top:26px;color:var(--soft);font-size:13.5px;text-align:center}
.vid{margin-top:20px;padding:22px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);text-align:center;line-height:1.6}
.vid p{margin:0 0 14px;color:var(--soft)}

/* טפסים */
.ftitle{font-family:var(--serif);font-weight:900;font-size:28px;margin:6px 0 18px}
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-weight:600;font-size:14.5px;margin-bottom:6px}
label.f>span em{font-style:normal;color:var(--soft);font-weight:400}
.inp{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;font-size:16px;outline:0;transition:.15s}
.inp:focus{border-color:var(--terra)}
textarea.inp{min-height:150px;resize:vertical;line-height:1.55}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.ph{display:flex;align-items:center;gap:12px}
.ph .prev{width:96px;height:72px;border-radius:12px;background:#efe3d2 center/cover;flex:none;display:grid;place-items:center;color:var(--soft)}
.err{color:#b3261e;font-size:14.5px;min-height:20px;margin:4px 0 10px}
.tabs{display:flex;background:#ece1d1;border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;height:42px;border-radius:11px;font-weight:600;color:var(--soft)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.hint{color:var(--soft);font-size:13.5px;line-height:1.5;margin:-6px 0 14px}
.urow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14.5px}
.urow small{color:var(--soft);display:block}
.temp{font-family:monospace;font-size:18px;background:#f9ecc9;padding:2px 8px;border-radius:6px;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
button.brand{text-align:right;display:block}
.brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(22px,7vw,30px);padding-bottom:2px}
.brand p{display:flex;align-items:center;gap:3px}
.brand p svg.i{width:16px;height:16px}
.acct.bk{color:var(--ink)}
.brow{width:100%;display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);text-align:right;border:2px solid transparent}
.brow.on{border-color:var(--terra)}
.brow .bico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#f3e2d3;color:var(--terra);flex:none}
.brow .bt{flex:1;min-width:0}
.brow b{display:block;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow small{color:var(--soft);font-size:13px}
.brow .cur{font-size:12.5px;color:var(--terra-d);font-weight:700}
.nb{display:flex;gap:8px;margin-top:8px}
.nb .inp{flex:1;min-width:0}
.seg{display:flex;flex-direction:column;gap:8px}
.seg button{display:flex;gap:10px;align-items:flex-start;text-align:right;padding:12px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);line-height:1.4}
.seg button.on{border-color:var(--terra);background:#fff4ea}
.seg button small{display:block;color:var(--soft);font-size:13px}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.urow .who{display:flex;align-items:center;gap:10px}
.loading{display:grid;place-items:center;padding:80px 0;color:var(--soft)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--terra);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="wrap">
  <header class="top">
    <img src="/logo.svg" alt="">
    <button class="brand" id="brand" aria-label="החלפת ספר"><h1 id="bname">מתכונים</h1><p>הספרים שלי<svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></p></button>
    <button class="acct bk" id="bset" aria-label="הגדרות הספר והזמנה" hidden><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5"/><path d="M19 8v6M16 11h6"/></svg></button>
    <button class="acct out" id="acct" aria-label="חשבון"></button>
  </header>
  <div class="search">
    <div class="sbox" id="sbox">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="מה מבשלים? שם או מצרך…" autocomplete="off" enterkeyhint="search">
      <button class="clr" id="clr" aria-label="ניקוי"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <nav class="chips" id="chips"></nav>
  </div>
  <div class="count" id="count"></div>
  <main class="grid" id="grid"><div class="loading" style="grid-column:1/-1"><div class="spin"></div></div></main>
</div>
<button class="fab" id="fab"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>מתכון חדש</button>
<section class="sheet" id="sheet" aria-modal="true" role="dialog"></section>
<div class="toast" id="toast"></div>

<script>
'use strict';
// ---------- אייקונים ----------
const IC = {
  all:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  chicken:'<path d="M15.5 4.5a5 5 0 0 1 0 7.07l-3.2 3.2-4.24-4.24 3.2-3.2a5 5 0 0 1 4.24-2.83z"/><path d="M8.06 10.53 5.6 13a1.8 1.8 0 1 1-2.2 2.83A1.8 1.8 0 1 1 6.2 18.6l2.47-2.46"/>',

  main:'<circle cx="12" cy="13" r="7"/><path d="M3 5v4a2 2 0 0 0 2 2V20M5 5v4M19 4v16M19 4c-2 1-2.5 4-2.5 6.5H19"/>',
  pesach:'<rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M4 9.5h16M4 14.5h16M9 5v14M15 5v14"/>',
  fish:'<path d="M3 12c3-5 8-6 12-4l5-3-1 7 1 7-5-3c-4 2-9 1-12-4z"/><circle cx="8" cy="11" r=".8" fill="currentColor"/>',
  soup:'<path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M8 4c-1 1.5 1 2.5 0 4M12 3c-1 1.5 1 2.5 0 4M16 4c-1 1.5 1 2.5 0 4"/><path d="M8 21h8"/>',
  salad:'<path d="M5 19C5 10 10 5 20 4c-1 10-6 15-15 15z"/><path d="M5 19 13 11"/>',
  side:'<path d="M14.5 9.5 5 19c-1 1-2.5-.5-1.5-1.5L13 8"/><path d="M13 8c1-3 4-4 7-4-0 3-1 6-4 7"/><path d="M15 6l3-3M18 9l3-1"/>',
  bake:'<path d="M5 11a7 5 0 0 1 14 0v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M9 9l1.5 3M13 8l1.5 3"/>',
  sweet:'<path d="M3 20h18l-2-9H5z"/><path d="M5 11c0-3 3-5 7-5s7 2 7 5"/><path d="M12 6V3"/><circle cx="12" cy="2.5" r=".6" fill="currentColor"/>',
  play:'<path d="M8 5v14l11-7z"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>',
  back:'<path d="M9 6l6 6-6 6"/>',
  share:'<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .7 3.2 2.7 3.8 5.5"/>',

// קבוצות מיוחדות בסינון

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, body) {
  const opt = { method: body ? 'POST' : 'GET', headers: {} };
  if (body) { opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(body); }
  if (TOKEN) opt.headers.authorization = 'Bearer ' + TOKEN;
  let res;
  try { res = await fetch(path, opt); } catch (e) { throw new Error('אין חיבור לאינטרנט. נסו שוב'); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && TOKEN) { setToken(''); ME = null; paintAcct(); }
  if (!res.ok) throw new Error(data.error || 'משהו השתבש. נסו שוב');
  return data;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---------- רשימה ראשית ----------
function paintChips() {
  const items = [['all','הכל'], ['main', GROUPS.main.name]].concat(CATS.map(c => [c[0], c[1]]), [['pesach', GROUPS.pesach.name]]);
  $('#chips').innerHTML = items.map(([k, n]) => `<button class="chip${FILTER === k ? ' on' : ''}" data-k="${k}">${k === 'all' ? '' : ic(k)}${n}</button>`).join('');
}
const fold = (s) => String(s || '').toLowerCase().replace(/[֑-ׇ"'׳״\-–]/g, '').replace(/\s+/g, ' ');
function visible() {
  const words = fold(QUERY).trim().split(' ').filter(Boolean);
  return RECIPES.filter(r => {
    if (FILTER !== 'all' && (GROUPS[FILTER] ? !GROUPS[FILTER].has(r) : r.cat !== FILTER)) return false;
    if (!words.length) return true;
    const hay = r._hay || (r._hay = fold([r.title, r.source, r.note, ...(r.ing || [])].join(' ')));
    return words.every(w => hay.includes(w));
  }).sort((a, b) => {
    if (!words.length) return b.sort - a.sort;
    const ta = words.every(w => fold(a.title).includes(w)), tb = words.every(w => fold(b.title).includes(w));
    return (tb - ta) || (b.sort - a.sort);
  });
}
function picHtml(r, cls) {
  const c = CAT[r.cat] || CAT.side;
  const tile = `<div class="tile" style="--tint:${c.tint};--tone:${c.tone}">${ic(r.cat)}</div>`;
  const img = r.img ? `<img src="${esc(r.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  return `<div class="${cls}" style="--tint:${c.tint}">${tile}${img}${r.video ? `<span class="badge">${ic('play')}סרטון</span>` : ''}</div>`;
}

  if (!list.length) {

function apply(d) {

async function load(q) {

async function start() {

let depth = 0;

function closeSheet() { if (depth > 0) { depth--; history.back(); } else { history.replaceState(null, '', location.pathname); route(); } }

  document.body.style.overflow = 'hidden';
}
function hideSheet() { sheet.classList.remove('open'); document.body.style.overflow = ''; releaseWake(); }
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  let m;
  if ((m = h.match(/^r\/([\w-]+)$/))) {
    const r = RECIPES.find(x => x.id === m[1]);
    if (r) return showRecipe(r);
    if (!LOADED) return; // עוד נטען
  } else if (h === 'add') return needLogin(() => (BOOK && BOOK.member) ? showForm(null) : (toast('רק מי שהוזמן לספר יכול להוסיף לו מתכונים'), toMain()));
  else if (h === 'books') return showBooks();
  else if (h === 'book' && BOOK) return showBookSettings();
  else if ((m = h.match(/^join\/([\w-]+)$/))) return showJoin(m[1]);
  else if ((m = h.match(/^edit\/([\w-]+)$/))) { const r = RECIPES.find(x => x.id === m[1]); if (r) return needLogin(() => showForm(r)); }
  else if (h === 'login') return showAuth();
  else if (h === 'me') { if (ME) return showAccount(); return showAuth(); }
  hideSheet();
}
addEventListener('hashchange', () => { route(); });

let wake = null;
async function keepAwake() { try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {} }

function showRecipe(r) {

        <a class="btn main" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${ic('play')}צפייה בסרטון</a>
        ${r.edit ? `<div style="height:8px"></div><button class="btn" data-act="edit">${ic('edit')}לכתוב את המתכון</button>` : ''}</div>` : ''}

async function shareRecipe(r) {

function booksHtml(inline) {
  const viewing = BOOK && !BOOKS.some(b => b.id === BOOK.id) && !BOOK.locked ? bookRow(BOOK, true) : '';
  return `<h1 class="ftitle"${inline ? ' style="font-size:24px;margin-top:4px"' : ''}>${inline ? (ME ? 'עוד אין לכם ספרים' : 'ברוכים הבאים לספר המתכונים') : 'הספרים שלי'}</h1>
      ${ME ? '' : `${viewing}<p class="hint" style="margin-top:6px">כאן שומרים מתכונים בספרים משותפים עם המשפחה והחברים. כדי לפתוח ספר או להצטרף לספר שהזמינו אתכם אליו, צריך להתחבר.</p><button class="btn main wide" id="blog">התחברות או הרשמה</button>`}
      ${ME ? `<div id="blist">${BOOKS.map(b => bookRow(b)).join('')}${viewing}</div>
      ${inline ? '<p class="hint" style="margin-top:0">פתחו ספר חדש, או בקשו ממישהו לשלוח לכם הזמנה לספר שלו.</p>' : ''}
      <h2 class="sec">ספר חדש</h2>
      <form class="nb" id="nb" novalidate><input class="inp" name="name" maxlength="40" placeholder="למשל: מתכונים של סבתא"><button class="btn main" type="submit">יצירה</button></form>
      <div class="err" id="nberr"></div>
      <p class="hint" style="margin-top:4px">ספר חדש נפתח ריק. אחרי שיוצרים אותו אפשר להזמין אליו אנשים בוואטסאפ.</p>` : ''}`;
}
function showBooks() {
  openSheet(`${closeBar()}<div class="in" style="padding-top:4px">${booksHtml(false)}</div>`);
  sheet.querySelector('[data-x]').onclick = closeSheet;
  bindBooks(sheet);
}
function bindBooks(root) {
  root.querySelectorAll('[data-b]').forEach(b => b.onclick = () => switchBook(b.dataset.b));
  const bl = root.querySelector('#blog'); if (bl) bl.onclick = () => needLogin(() => toMain());
  const nb = root.querySelector('#nb');
  if (nb) nb.onsubmit = async (e) => {
    e.preventDefault(); root.querySelector('#nberr').textContent = '';
    const name = String(new FormData(e.target).get('name') || '').trim();
    if (name.length < 2) return root.querySelector('#nberr').textContent = 'צריך לתת לספר שם';
    const btn = e.target.querySelector('button'); btn.disabled = true;
    try { const d = await api('/api/books', { name }); apply(d); toMain(); toast('הספר נוצר. אפשר להזמין אליו אנשים מהכפתור למעלה'); }
    catch (err) { root.querySelector('#nberr').textContent = err.message; btn.disabled = false; }
  };
}

// ---------- הגדרות ספר והזמנה ----------
const inviteUrl = () => location.origin + '/#join/' + BOOK.invite;
async function sendInvite() {
  const text = `הזמנה לספר המתכונים "${BOOK.name}". נכנסים לקישור, נרשמים, ואפשר לראות ולהוסיף מתכונים:`;
  if (navigator.share) { try { await navigator.share({ title: BOOK.name, text, url: inviteUrl() }); } catch (e) {} return; }
  open('https://wa.me/?text=' + encodeURIComponent(text + '\n' + inviteUrl()), '_blank', 'noopener');
}
function showBookSettings() {
  const b = BOOK;
  openSheet(`${closeBar()}
    <div class="in" style="padding-top:4px">
      <h1 class="ftitle" style="margin-bottom:6px">${esc(b.name)}</h1>
      <p class="hint" style="margin:0 0 18px">${b.count} מתכונים${b.owner ? ' · נפתח על ידי ' + esc(b.mine ? 'אותך' : b.owner) : ''}</p>
      ${b.member ? `<h2 class="sec" style="margin-top:6px">הזמנה לספר</h2>
        <p class="hint" style="margin:0 0 10px">מי שנכנס לקישור ונרשם יכול לראות את הספר ולהוסיף ולערוך בו מתכונים.</p>
        <div class="acts" style="margin-top:0"><button class="btn main" id="inv">${ic('share')}שליחת הזמנה בוואטסאפ</button><button class="btn" id="cpy">${ic('copy')}העתקת הקישור</button></div>
        ${b.mine ? '<button class="btn" id="newinv" style="margin-top:4px;font-size:14px;height:40px">קישור חדש (הקישור הישן יפסיק לעבוד)</button>' : ''}` : ''}
      ${b.mine ? `<h2 class="sec">מי יכול לראות</h2>
        <div class="seg" id="priv">
          <button data-p="0" class="${b.private ? '' : 'on'}">${ic('globe')}<span>ציבורי<small>כל מי שיש לו קישור יכול לקרוא. להוסיף ולערוך רק מי שהוזמן</small></span></button>
          <button data-p="1" class="${b.private ? 'on' : ''}">${ic('lock')}<span>פרטי<small>רק מי שהוזמן לספר יכול לראות אותו</small></span></button>
        </div>
        <h2 class="sec">שם הספר</h2>
        <form class="nb" id="ren" novalidate><input class="inp" name="name" maxlength="40" value="${esc(b.name)}"><button class="btn dark" type="submit">שמירה</button></form>
        <div class="err" id="renerr"></div>` : ''}
      ${b.member ? `<h2 class="sec">${ic('people')}חברים בספר</h2><div id="mem"><div class="spin"></div></div>` : ''}
      ${b.member && !b.mine ? '<button class="btn wide" id="leave" style="margin-top:22px;color:#b3261e">יציאה מהספר</button>' : ''}
      ${b.mine && !b.family ? `<button class="btn wide" id="bdel" style="margin-top:22px;color:#b3261e">${ic('trash')}מחיקת הספר</button>` : ''}
    </div>`);
  sheet.querySelector('[data-x]').onclick = closeSheet;
  const on = (id, fn) => { const el = $('#' + id); if (el) el.onclick = fn; };
  on('inv', sendInvite);
  on('cpy', async () => { try { await navigator.clipboard.writeText(inviteUrl()); toast('הקישור הועתק'); } catch (e) { prompt('העתיקו את הקישור:', inviteUrl()); } });
  on('newinv', async () => {
    if (!confirm('ליצור קישור הזמנה חדש? מי שקיבל את הקישור הישן לא יוכל להצטרף דרכו. מי שכבר בספר נשאר.')) return;
    try { apply(await api(`/api/books/${b.id}/invite`, {})); toast('נוצר קישור חדש'); } catch (e) { toast(e.message); }
  });
  sheet.querySelectorAll('[data-p]').forEach(x => x.onclick = async () => {
    try { apply(await api(`/api/books/${b.id}`, { private: x.dataset.p === '1' })); showBookSettings(); toast(BOOK.private ? 'הספר פרטי עכשיו' : 'הספר ציבורי עכשיו'); }
    catch (e) { toast(e.message); }
  });
  const ren = $('#ren');
  if (ren) ren.onsubmit = async (e) => {
    e.preventDefault(); $('#renerr').textContent = '';
    try { apply(await api(`/api/books/${b.id}`, { name: new FormData(e.target).get('name') })); showBookSettings(); toast('השם נשמר'); }
    catch (err) { $('#renerr').textContent = err.message; }
  };
  on('leave', async () => {
    if (!confirm(`לצאת מהספר "${b.name}"? כדי לחזור תצטרכו הזמנה חדשה.`)) return;
    try { await api(`/api/books/${b.id}/leave`, {}); await switchBook(''); toast('יצאתם מהספר'); } catch (e) { toast(e.message); }
  });
  on('bdel', async () => {
    if (!confirm(`למחוק את הספר "${b.name}" עם כל ${b.count} המתכונים שבו? אי אפשר לבטל את זה.`)) return;
    try { await api(`/api/books/${b.id}/delete`, {}); await switchBook(''); toast('הספר נמחק'); } catch (e) { toast(e.message); }
  });
  if (b.member) loadMembers(b);
}
async function loadMembers(b) {
  try {
    const d = await api(`/api/books/${b.id}/members`);
    $('#mem').innerHTML = d.members.map(u => `<div class="urow"><div class="who"><span class="dot" style="background:${esc(u.color)}">${esc((u.name || '?').charAt(0))}</span>
      <div>${esc(u.name)}${ME && u.id === ME.id ? ' (אני)' : ''}<small>${u.owner ? 'פתח את הספר' : 'חבר בספר'}</small></div></div>
      ${b.mine && !u.owner ? `<button class="btn" data-rm="${u.id}" data-name="${esc(u.name)}" style="height:38px">הוצאה</button>` : ''}</div>`).join('');
    $('#mem').querySelectorAll('[data-rm]').forEach(x => x.onclick = async () => {
      if (!confirm(`להוציא את ${x.dataset.name} מהספר?`)) return;
      try { await api(`/api/books/${b.id}/remove`, { user: +x.dataset.rm }); x.closest('.urow').remove(); toast('הוצא מהספר'); } catch (e) { toast(e.message); }
    });
  } catch (e) { $('#mem').textContent = e.message; }
}

// ---------- הצטרפות מקישור הזמנה ----------
async function showJoin(token) {
  openSheet(`${closeBar()}<div class="in"><div class="loading"><div class="spin"></div></div></div>`);
  sheet.querySelector('[data-x]').onclick = toMain;
  let d;
  try { d = await api('/api/invite/' + encodeURIComponent(token)); }
  catch (e) {
    sheet.querySelector('.in').innerHTML = `<div class="empty"><b>ההזמנה לא עובדת</b>${esc(e.message)}</div>`;
    return;
  }
  sheet.querySelector('.in').innerHTML = `<div style="text-align:center;padding-top:30px">
      <div class="bico" style="width:72px;height:72px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:#f3e2d3;color:var(--terra)">${ic('book')}</div>
      <p class="hint" style="margin:0">${d.book.owner ? esc(d.book.owner) + ' מזמין/ה אתכם לספר' : 'הוזמנתם לספר'}</p>
      <h1 class="ftitle" style="margin:6px 0 22px">${esc(d.book.name)}</h1>
      <button class="btn main wide" id="join">${d.member ? 'פתיחת הספר' : 'הצטרפות לספר'}</button>
      ${ME ? '' : '<p class="hint" style="margin-top:12px">כדי להצטרף צריך להתחבר או להירשם. זה לוקח חצי דקה.</p>'}
    </div>`;
  $('#join').onclick = () => needLogin(async () => {
    try { const r = await api('/api/join', { token }); await switchBook(r.book); toast('הצטרפתם לספר ' + d.book.name); }
    catch (e) { toast(e.message); toMain(); }
  }, `כדי להצטרף לספר "${d.book.name}" צריך להתחבר. אין לכם משתמש? בחרו "משתמש חדש".`);
}

// ---------- הוספה ועריכה ----------
let photoData;
function showForm(r) {
  photoData = undefined;
  const cat = r ? r.cat : '';
  openSheet(`
    <div class="bar"><button class="round" data-x="close" aria-label="סגירה">${ic('close')}</button><span></span></div>
    <div class="in" style="padding-top:4px">
      <h1 class="ftitle">${r ? 'עריכת מתכון' : 'מתכון חדש'}</h1>
      <form id="rf" novalidate>
        <label class="f"><span>שם המתכון</span><input class="inp" name="title" maxlength="80" value="${esc(r ? r.title : '')}" placeholder="למשל: עוגת השיש של סבתא"></label>
        <div class="f" style="margin-bottom:14px"><span style="display:block;font-weight:600;font-size:14.5px;margin-bottom:6px">סוג</span>
          <div class="cats">${CATS.map(c => `<button type="button" class="chip${cat === c[0] ? ' on' : ''}" data-cat="${c[0]}">${ic(c[0])}${c[1]}</button>`).join('')}</div></div>
        <div class="f" style="margin-bottom:14px"><span style="display:block;font-weight:600;font-size:14.5px;margin-bottom:6px">תמונה <em style="font-style:normal;color:var(--soft);font-weight:400">(לא חובה)</em></span>
          <div class="ph"><div class="prev" id="prev" style="${r && r.img ? `background-image:url('${esc(r.img)}')` : ''}">${r && r.img ? '' : ic('camera')}</div>
          <label class="btn">${ic('camera')}בחירת תמונה<input type="file" accept="image/*" id="pfile" hidden></label>
          ${r && r.img ? `<button type="button" class="btn" id="nophoto" aria-label="הסרת תמונה">${ic('trash')}</button>` : ''}</div></div>
        <label class="f"><span>מצרכים <em>– כל מצרך בשורה. כותרת? מסיימים בנקודתיים, למשל "לרוטב:"</em></span>
          <textarea class="inp" name="ing" placeholder="2 כוסות קמח&#10;3 ביצים&#10;לציפוי:&#10;100 גרם שוקולד">${esc(r ? (r.ing || []).join('\n') : '')}</textarea></label>
        <label class="f"><span>אופן ההכנה <em>– כל שלב בשורה</em></span>
          <textarea class="inp" name="steps" placeholder="מחממים תנור ל-180 מעלות&#10;מערבבים הכל בקערה">${esc(r ? (r.steps || []).join('\n') : '')}</textarea></label>
        <label class="f"><span>כמות <em>(לא חובה)</em></span><input class="inp" name="servings" maxlength="40" value="${esc(r ? r.servings : '')}" placeholder="למשל: 6 מנות"></label>
        <label class="f"><span>קישור למקור <em>(לא חובה)</em></span><input class="inp" name="url" type="url" dir="ltr" value="${esc(r ? r.url : '')}" placeholder="https://"></label>
        <label class="f"><span>ממי המתכון <em>(לא חובה)</em></span><input class="inp" name="source" maxlength="80" value="${esc(r ? r.source : '')}" placeholder="למשל: סבתא רחל"></label>
        <label class="f"><span>הערה <em>(לא חובה)</em></span><input class="inp" name="note" maxlength="600" value="${esc(r ? r.note : '')}" placeholder="טיפ, שינוי שעשיתם..."></label>
        <div class="err" id="ferr"></div>
        <button class="btn main wide" type="submit">${r ? 'שמירת שינויים' : 'הוספה ל' + esc(BOOK.name)}</button>
        ${r && r.del ? `<button type="button" class="btn wide" id="del" style="margin-top:10px;color:#b3261e">${ic('trash')}מחיקת המתכון</button>` : ''}
      </form>
    </div>`);
  sheet.querySelector('[data-x]').onclick = closeSheet;
  let chosen = cat;
  sheet.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
    chosen = b.dataset.cat; sheet.querySelectorAll('[data-cat]').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#pfile').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    if (!/^image\//.test(f.type)) return toast('אפשר לבחור רק תמונה');
    try {
      photoData = await shrink(f);
      const p = $('#prev'); p.style.backgroundImage = `url('${photoData}')`; p.innerHTML = '';
    } catch (err) { toast('לא הצלחנו לקרוא את התמונה'); }
  };
  const np = $('#nophoto'); if (np) np.onclick = () => { photoData = null; const p = $('#prev'); p.style.backgroundImage = ''; p.innerHTML = ic('camera'); np.remove(); };
  const del = $('#del');
  if (del) del.onclick = async () => {
    if (!confirm('למחוק את המתכון לגמרי?')) return;
    try { const d = await api(`/api/recipes/${r.id}/delete`, {}); apply(d); toMain(); toast('המתכון נמחק'); }
    catch (err) { $('#ferr').textContent = err.message; }
  };
  $('#rf').onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const btn = e.target.querySelector('button[type=submit]');
    $('#ferr').textContent = '';
    if (!f.title.trim()) return $('#ferr').textContent = 'צריך לתת למתכון שם';
    if (!chosen) return $('#ferr').textContent = 'בחרו סוג מנה';
    btn.disabled = true;
    try {
      const body = { ...f, cat: chosen, ing: f.ing.split('\n'), steps: f.steps.split('\n'), book: BOOK.id };
      if (photoData !== undefined) body.photo = photoData;
      const d = await api(r ? `/api/recipes/${r.id}` : '/api/recipes', body);
      apply(d);
      // מחליפים את הטופס במתכון עצמו
      history.replaceState(null, '', '#r/' + d.id); route();
      toast(r ? 'נשמר' : 'המתכון נוסף לספר');
    } catch (err) { $('#ferr').textContent = err.message; btn.disabled = false; }
  };
}
function shrink(file) {
  return new Promise((ok, fail) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const max = 1200;
      if (Math.max(w, h) > max) { const k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      let q = .82, out = c.toDataURL('image/jpeg', q);
      while (out.length > 440000 && q > .4) { q -= .1; out = c.toDataURL('image/jpeg', q); }
      ok(out);
    };
    img.onerror = fail; img.src = url;
  });
}

// ---------- אירועים ----------
$('#chips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  FILTER = b.dataset.k; paintChips(); paintGrid(); scrollTo({ top: 0, behavior: 'smooth' });
});
$('#q').addEventListener('input', (e) => { QUERY = e.target.value; $('#sbox').classList.toggle('has', !!QUERY); paintGrid(); });
$('#clr').onclick = () => { $('#q').value = ''; QUERY = ''; $('#sbox').classList.remove('has'); paintGrid(); };
$('#grid').addEventListener('click', (e) => { const c = e.target.closest('.card'); if (c) go('r/' + c.dataset.id); });
$('#fab').onclick = () => go('add');
$('#acct').onclick = () => go(ME ? 'me' : 'login');
$('#brand').onclick = () => go('books');
$('#bset').onclick = () => go('book');
addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet(); });

paintChips(); paintAcct(); start();
</script>
